name: Publicar locuções

on:
  workflow_dispatch:

concurrency:
  group: locutor
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  rascunhos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar rascunhos das linhas Pendentes
        run: python src/gerar_rascunhos.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  construir:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.construir.outputs.mudou }}
      falhas: ${{ steps.construir.outputs.falhas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar áudios e montar o site
        id: construir
        run: python src/publicar.py construir
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Preparar o site para o Pages
        if: steps.construir.outputs.mudou == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Guardar o que deve ser marcado na planilha
        uses: actions/upload-artifact@v4
        with:
          name: estado
          path: estado/estado.json

  publicar:
    needs: construir
    if: needs.construir.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  marcar:
    needs: [construir, publicar]
    if: ${{ !cancelled() && needs.construir.result == 'success' && (needs.publicar.result == 'success' || needs.publicar.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: estado
          path: estado
      - name: Atualizar status na planilha
        run: python src/publicar.py marcar
      - name: Sinalizar anúncios que não viraram áudio
        if: needs.construir.outputs.falhas != '' && needs.construir.outputs.falhas != '0'
        run: |
          echo "::error::${{ needs.construir.outputs.falhas }} anúncio(s) não puderam virar áudio. Veja os avisos do job construir."
          exit 1

  avisar:
    needs: [rascunhos, construir, publicar, marcar]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Ver se a execução anterior já tinha falhado
        id: anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          anterior=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publicar.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
          echo "conclusao=$anterior" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar detalhes dos problemas
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: estado
          path: estado
      - name: Enviar e-mail de aviso
        if: steps.anterior.outputs.conclusao != 'failure'
        run: python src/avisar_erro.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NEEDS_JSON: ${{ toJSON(needs) }}
